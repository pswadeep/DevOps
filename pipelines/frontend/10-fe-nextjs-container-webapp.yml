name: fe-next-$(Date:yyyyMMdd)$(Rev:.r)
trigger:
  branches: { include: [main] }
  paths: { include: [apps/storefront/**] }
pr: none

parameters:
- name: environments
  type: object
  default: [dev, stage, prod]

stages:
- template: ../../templates/stages/build-docker.yml
  parameters:
    repository: storefront
    dockerfile: apps/storefront/Dockerfile
    context: apps/storefront

- ${{ each env in parameters.environments }}:
  - template: ../../templates/stages/deploy-env.yml
    parameters:
      envName: ${{ env }}
      steps:
      - task: AzureAppServiceSettings@1
        displayName: App settings and Key Vault references
        inputs:
          azureSubscription: sc-azure-${{ env }}
          appName: $(webAppName)
          resourceGroupName: $(rgName)
          appSettings: |
            [
              { "name": "NEXT_PUBLIC_API_URL", "value": "$(apiUrl)", "slotSetting": false },
              { "name": "SESSION_KEY", "value": "@Microsoft.KeyVault(VaultName=$(kvName);SecretName=session-key)", "slotSetting": false }
            ]
      - task: AzureWebAppContainer@1
        displayName: Deploy container
        inputs:
          azureSubscription: sc-azure-${{ env }}
          appName: $(webAppName)
          containers: $(acrLoginServer)/storefront:$(Build.BuildId)
      - template: ../../templates/steps/smoke-test.yml
        parameters:
          url: https://$(webAppName).azurewebsites.net/api/health
