name: gitleaks-$(Build.BuildId)
trigger: none
pr: none
schedules:
- cron: '0 2 * * *'
  displayName: Nightly full-history scan
  branches: { include: [main] }
  always: true

pool: { vmImage: ubuntu-latest }

steps:
- checkout: self
  fetchDepth: 0
- bash: |
    docker run --rm -v "$(Build.SourcesDirectory):/repo" zricethezav/gitleaks:v8.21.2 \
      detect --source /repo --redact --report-format sarif --report-path /repo/gitleaks.sarif --exit-code 1
  displayName: Gitleaks detect
- publish: $(Build.SourcesDirectory)/gitleaks.sarif
  artifact: gitleaks
  condition: always()
- template: ../../templates/steps/notify-teams.yml
  parameters:
    title: Secret found in repository history
    condition: failed()
