name: kv-rotate-$(Date:yyyyMMdd)
trigger: none
pr: none
schedules:
- cron: '0 22 1 * *'
  displayName: Monthly rotation
  branches: { include: [main] }
  always: true

parameters:
- name: environments
  type: object
  default: [dev, stage, prod]

stages:
- ${{ each env in parameters.environments }}:
  - stage: rotate_${{ env }}
    ${{ if eq(env, 'dev') }}:
      dependsOn: []
    ${{ elseif eq(env, 'stage') }}:
      dependsOn: [rotate_dev]
    ${{ else }}:
      dependsOn: [rotate_stage]
    variables:
    - group: vg-${{ env }}
    jobs:
    - deployment: rotate
      environment: ${{ env }}
      pool: { vmImage: ubuntu-latest }
      strategy:
        runOnce:
          deploy:
            steps:
            - task: AzureCLI@2
              displayName: Rotate key and update Key Vault
              inputs:
                azureSubscription: sc-azure-${{ env }}
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -euo pipefail
                  # alternate key1 / key2 by month so the key apps currently use stays valid
                  KEY=$([ $(( $(date +%-m) % 2 )) -eq 0 ] && echo key1 || echo key2)
                  az storage account keys renew -g $(rgName) -n $(storageAccount) --key $KEY -o none
                  VALUE=$(az storage account keys list -g $(rgName) -n $(storageAccount) --query "[?keyName=='$KEY'].value | [0]" -o tsv)
                  echo "##vso[task.setvariable variable=newKey;issecret=true]$VALUE"
                  EXP=$(date -u -d '+120 days' +%Y-%m-%dT%H:%M:%SZ)
                  az keyvault secret set --vault-name $(kvName) -n storage-key --value "$VALUE" --expires "$EXP" -o none
                  az webapp restart -g $(rgName) -n $(webAppName)
