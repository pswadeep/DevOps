apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: orders-dev, namespace: argocd }
spec:
  project: default
  source:
    repoURL: https://dev.azure.com/acme/platform/_git/acme-devops-platform
    targetRevision: main
    path: apps/orders/overlays/dev
  destination: { server: https://kubernetes.default.svc, namespace: orders-dev }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
